<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#126BFA" />
      <stop offset="50%" stop-color="#0B61EE" />
      <stop offset="100%" stop-color="#004AD7" />
    </linearGradient>
  </defs>

  <!-- Blue Background Badge Circle -->
  <circle cx="250" cy="250" r="240" fill="url(#brandGradient)" />

  <!-- Top-Left Signal Radar Arcs -->
  <path d="M 115 220 A 160 160 0 0 1 230 105" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" />
  <path d="M 148 205 A 120 120 0 0 1 230 138" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" />

  <!-- Top-Right Signal Radar Arcs -->
  <path d="M 270 105 A 160 160 0 0 1 385 220" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" />
  <path d="M 270 138 A 120 120 0 0 1 352 205" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" />

  <!-- White Map Location Pin -->
  <path d="M 250 375
           C 175 305, 170 270, 170 235
           A 80 80 0 1 1 330 235
           C 330 270, 325 305, 250 375 Z"
        fill="#FFFFFF" />

  <!-- Inner Blue Circle inside Location Pin Head -->
  <circle cx="250" cy="235" r="54" fill="url(#brandGradient)" />

  <!-- White Bold 'p' in Center of Inner Circle -->
  <path d="M 230 208
           L 230 270
           L 245 270
           L 245 250
           C 250 253, 256 254, 262 254
           C 277 254, 288 244, 288 231
           C 288 218, 277 208, 262 208
           Z
           M 245 222
           L 261 222
           C 267 222, 273 225.5, 273 231
           C 273 236.5, 267 240, 261 240
           L 245 240 Z"
        fill="#FFFFFF" />
</svg>
